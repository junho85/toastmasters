<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toastmasters Table Topics - Question 5</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    <style>
        /* Slide-specific styles */
        .slide {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://mapsandmerlot.b-cdn.net/wp-content/uploads/2017/08/1.-Bora-Bora-1024x582.jpg');
            background-size: cover;
            background-position: center;
        }
        .home-button {
            color: #8B5CF6;
        }
        .home-button:hover {
            background-color: #8B5CF6;
        }
        .question-number {
            background-color: #8B5CF6;
        }
        .nav-button {
            color: #8B5CF6;
        }
        .nav-button:hover {
            background-color: #8B5CF6;
        }
        .fullscreen-button {
            color: #8B5CF6;
        }
        .fullscreen-button:hover {
            background-color: #8B5CF6;
        }
    </style>
</head>
<body>
<div class="slide flex flex-col items-center justify-center">
    <div class="question-container">
        <h2 class="text-4xl font-bold text-purple-600 mb-6 text-center">If you could go anywhere right now for a summer vacation, where would you choose?</h2>
    </div>

    <div class="question-number">5</div>

    <button class="home-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(1)">
        <i class="fas fa-home"></i>
    </button>

    <button class="nav-button prev-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(5)">
        <i class="fas fa-arrow-left"></i>
    </button>
    
    <button class="fullscreen-button" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        <i class="fas fa-expand" id="fullscreen-icon"></i>
    </button>
</div>

<script>
    // Setup keyboard navigation (last slide, no next)
    setupKeyboardNavigation({ prevSlide: 'slide5.html' });
</script>
</body>
</html>
