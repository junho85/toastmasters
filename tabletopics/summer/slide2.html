<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toastmasters Table Topics - Question 1</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    <style>
        /* Slide-specific styles */
        .slide {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://hips.hearstapps.com/hmg-prod/images/family-at-the-beach-royalty-free-image-1680117145.jpg');
            background-size: cover;
            background-position: center;
        }
        .home-button {
            color: #2563EB;
        }
        .home-button:hover {
            background-color: #2563EB;
        }
        .question-number {
            background-color: #EF4444;
        }
        .fullscreen-button {
            color: #EF4444;
        }
        .fullscreen-button:hover {
            background-color: #EF4444;
        }
    </style>
</head>
<body>
<div class="slide flex flex-col items-center justify-center">
    <div class="question-container">
        <h2 class="text-4xl font-bold text-blue-600 mb-6 text-center">What was your most memorable summer vacation?</h2>
        <p class="text-2xl text-gray-700 text-center">Why was it special?</p>
    </div>

    <div class="question-number">1</div>

    <button class="home-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(1)">
        <i class="fas fa-home"></i>
    </button>
    
    <button class="fullscreen-button" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        <i class="fas fa-expand" id="fullscreen-icon"></i>
    </button>
</div>

<script>
    // Setup keyboard navigation
    setupKeyboardNavigation({ nextSlide: 'slide3.html' });
</script>
</body>
</html>
