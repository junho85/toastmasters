<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toastmasters Table Topics - Question 2</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    <style>
        /* Slide-specific styles */
        .slide {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://miro.medium.com/v2/resize:fit:1200/1*salDf3Mxl7kmAe9ovXt2tw.jpeg');
            background-size: cover;
            background-position: center;
        }
        .home-button {
            color: #F59E0B;
        }
        .home-button:hover {
            background-color: #F59E0B;
        }
        .question-number {
            background-color: #F59E0B;
        }
        .nav-button {
            color: #F59E0B;
        }
        .nav-button:hover {
            background-color: #F59E0B;
        }
        .fullscreen-button {
            color: #F59E0B;
        }
        .fullscreen-button:hover {
            background-color: #F59E0B;
        }
    </style>
</head>
<body>
<div class="slide flex flex-col items-center justify-center">
    <div class="question-container">
        <h2 class="text-4xl font-bold text-yellow-600 mb-6 text-center">Could you share a memory that comes to mind</h2>
        <p class="text-2xl text-gray-700 text-center">when you think of "summer break" during your school days?</p>
    </div>

    <div class="question-number">2</div>

    <button class="home-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(1)">
        <i class="fas fa-home"></i>
    </button>

    <button class="nav-button prev-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(2)">
        <i class="fas fa-arrow-left"></i>
    </button>

    <button class="nav-button next-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(4)">
        <i class="fas fa-arrow-right"></i>
    </button>
    
    <button class="fullscreen-button" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        <i class="fas fa-expand" id="fullscreen-icon"></i>
    </button>
</div>

<script>
    // Setup keyboard navigation
    setupKeyboardNavigation({ prevSlide: 'slide2.html', nextSlide: 'slide4.html' });
</script>
</body>
</html>
