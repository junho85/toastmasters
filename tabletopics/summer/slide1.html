<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toastmasters Table Topics Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #87CEEB, #0078c8);
            overflow: hidden;
        }
        .sun {
            position: absolute;
            top: 60px;
            right: 80px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #FFD700, #FFA500);
            border-radius: 50%;
            box-shadow: 0 0 50px 30px rgba(255, 215, 0, 0.5);
            animation: pulse 3s infinite alternate;
            z-index: 2;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.9;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            animation: float-cloud 25s linear infinite;
        }
        .cloud1 {
            top: 100px;
            left: -150px;
            width: 200px;
            height: 60px;
        }
        .cloud2 {
            top: 200px;
            left: -300px;
            width: 180px;
            height: 50px;
            animation-delay: 5s;
        }
        @keyframes float-cloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(1500px); }
        }
        @keyframes pulse {
            from { transform: scale(1); box-shadow: 0 0 50px 25px rgba(255, 215, 0, 0.5); }
            to { transform: scale(1.1); box-shadow: 0 0 60px 35px rgba(255, 215, 0, 0.65); }
        }
        .number-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            font-size: 52px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 22px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 6px 6px rgba(0, 0, 0, 0.15);
            background-size: cover;
            background-position: center;
            border: 5px solid white;
            position: relative;
            overflow: hidden;
        }
        .number-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.1);
            z-index: 1;
        }
        .number-button:hover {
            transform: scale(1.15) translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }
        .number-button span {
            position: relative;
            z-index: 2;
        }
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/85486/wave.svg');
            background-size: 1000px 120px;
        }
        .wave.wave1 {
            animation: animate 25s linear infinite;
            z-index: 1000;
            opacity: 0.7;
            animation-delay: 0s;
            bottom: 0;
        }
        .wave.wave2 {
            animation: animate2 15s linear infinite;
            z-index: 999;
            opacity: 0.5;
            animation-delay: -5s;
            bottom: 10px;
        }
        .wave.wave3 {
            animation: animate 30s linear infinite;
            z-index: 998;
            opacity: 0.3;
            animation-delay: -2s;
            bottom: 20px;
            height: 100px;
        }
        @keyframes animate {
            0% { background-position-x: 0; }
            100% { background-position-x: 1000px; }
        }
        @keyframes animate2 {
            0% { background-position-x: 0; }
            100% { background-position-x: -1000px; }
        }
        .title-container {
            position: relative;
            z-index: 10;
        }
        .title-text {
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        .beach-icon {
            display: inline-block;
            margin-right: 10px;
            animation: rotate 8s linear infinite;
            transform-origin: center;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>
<div class="slide flex flex-col items-center justify-center">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>

    <div class="title-container">
        <h1 class="text-6xl font-bold text-white mb-5 mt-8 text-center z-10 title-text">
            <span class="beach-icon"><i class="fas fa-umbrella-beach"></i></span>Summer Table Topics
        </h1>
        <h2 class="text-3xl font-bold text-white mb-16 opacity-90 text-center z-10" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">Choose a number to begin</h2>
    </div>

    <div class="flex justify-center items-center mb-16 z-10">
        <div class="number-button" onclick="goToSlide(2)" style="background-image: linear-gradient(rgba(239, 68, 68, 0.5), rgba(239, 68, 68, 0.7)), url('https://hips.hearstapps.com/hmg-prod/images/family-at-the-beach-royalty-free-image-1680117145.jpg')">
            <span>1</span>
        </div>

        <div class="number-button" onclick="goToSlide(3)" style="background-image: linear-gradient(rgba(245, 158, 11, 0.5), rgba(245, 158, 11, 0.7)), url('https://miro.medium.com/v2/resize:fit:1200/1*salDf3Mxl7kmAe9ovXt2tw.jpeg')">
            <span>2</span>
        </div>

        <div class="number-button" onclick="goToSlide(4)" style="background-image: linear-gradient(rgba(16, 185, 129, 0.5), rgba(16, 185, 129, 0.7)), url('https://cms-tc.pbskids.org/parents/new-ideas-and-activities-to-try-this-summer.jpg')">
            <span>3</span>
        </div>

        <div class="number-button" onclick="goToSlide(5)" style="background-image: linear-gradient(rgba(59, 130, 246, 0.5), rgba(59, 130, 246, 0.7)), url('https://www.ultramodern.com/wp-content/uploads/2019/07/heat.png')">
            <span>4</span>
        </div>

        <div class="number-button" onclick="goToSlide(6)" style="background-image: linear-gradient(rgba(139, 92, 246, 0.5), rgba(139, 92, 246, 0.7)), url('https://mapsandmerlot.b-cdn.net/wp-content/uploads/2017/08/1.-Bora-Bora-1024x582.jpg')">
            <span>5</span>
        </div>
    </div>

    <p class="text-white text-xl opacity-90 text-center max-w-xl z-10 font-semibold" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">Click on a number to reveal your table topics question</p>
</div>

<script>
    function goToSlide(slideNumber) {
        window.location.href = `slide${slideNumber}.html`;
    }

    // Preload the next slides
    window.onload = function() {
        for(let i = 2; i <= 6; i++) {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = `slide${i}.html`;
            document.head.appendChild(link);
        }

        // Add keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (event.key >= '1' && event.key <= '5') {
                const slideNumber = parseInt(event.key) + 1;
                goToSlide(slideNumber);
            }
        });
    }
</script>
</body>
</html>
