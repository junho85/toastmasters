<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toastmasters Table Topics - Question 4</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    <style>
        /* Slide-specific styles */
        .slide {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://www.juddbuilders.com/juddbuildersblog/wp-content/uploads/2019/05/iStock-1040941164-1024x683.jpg');
            background-size: cover;
            background-position: center;
        }
        .home-button {
            color: #3B82F6;
        }
        .home-button:hover {
            background-color: #3B82F6;
        }
        .question-number {
            background-color: #3B82F6;
        }
        .nav-button {
            color: #3B82F6;
        }
        .nav-button:hover {
            background-color: #3B82F6;
        }
        .fullscreen-button {
            color: #3B82F6;
        }
        .fullscreen-button:hover {
            background-color: #3B82F6;
        }
    </style>
</head>
<body>
<div class="slide flex flex-col items-center justify-center">
    <div class="question-container">
        <h2 class="text-4xl font-bold text-blue-600 mb-6 text-center">What is your own unique way to beat the summer heat?</h2>
    </div>

    <div class="question-number">4</div>

    <button class="home-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(1)">
        <i class="fas fa-home"></i>
    </button>

    <button class="nav-button prev-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(4)">
        <i class="fas fa-arrow-left"></i>
    </button>

    <button class="nav-button next-button" onclick="checkFullscreenBeforeNavigate(); goToSlide(6)">
        <i class="fas fa-arrow-right"></i>
    </button>
    
    <button class="fullscreen-button" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        <i class="fas fa-expand" id="fullscreen-icon"></i>
    </button>
</div>

<script>
    // Setup keyboard navigation
    setupKeyboardNavigation({ prevSlide: 'slide4.html', nextSlide: 'slide6.html' });
</script>
</body>
</html>
